name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/mwodevelop/kodi-profile-sync-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR for an immutable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/mwodevelop/kodi-profile-sync-server:sha-${{ github.sha }}
          build-args: BUILD_REVISION=git:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify immutable manifest platforms
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            > manifest.json
          python - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
                  entry.get("platform", {}).get("variant"),
              )
              for entry in manifest.get("manifests", [])
          }
          required = {
              ("linux", "amd64", None),
              ("linux", "arm", "v7"),
          }
          missing = required - platforms
          if missing:
              raise SystemExit(f"missing release platforms: {sorted(missing)}")
          print("verified platforms: linux/amd64, linux/arm/v7")
          PY
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: profile-sync-image-digest
          path: image-digest.txt
          retention-days: 90
