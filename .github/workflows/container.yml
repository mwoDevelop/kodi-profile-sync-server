name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_rc:
        description: Publish an immutable release-candidate manifest
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/mwodevelop/kodi-profile-sync-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing the Docker build
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/profile-sync-security-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-sync-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile-sync-security-report.json
          retention-days: 90
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to GHCR for an immutable release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_rc
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_rc == true) }}
          tags: ghcr.io/mwodevelop/kodi-profile-sync-server:sha-${{ github.sha }}
          build-args: BUILD_REVISION=git:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_rc
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-sync-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: qnap-approval
      - name: Verify immutable manifest platforms
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            > manifest.json
          python - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
                  entry.get("platform", {}).get("variant"),
              )
              for entry in manifest.get("manifests", [])
          }
          required = {
              ("linux", "amd64", None),
              ("linux", "arm", "v7"),
          }
          missing = required - platforms
          if missing:
              raise SystemExit(f"missing release platforms: {sorted(missing)}")
          print("verified platforms: linux/amd64, linux/arm/v7")
          PY
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - name: Compose exact QNAP image approval
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = ["Dockerfile", "pyproject.toml", "README.md", "src"]
          tree = subprocess.check_output(
              ["git", "ls-tree", "-r", os.environ["GITHUB_SHA"], "--", *paths]
          )
          policy = json.dumps({
              "dockerfile": "Dockerfile",
              "platforms": ["linux/amd64", "linux/arm/v7"],
              "build_revision": True,
              "input_paths": paths,
          }, sort_keys=True, separators=(",", ":")).encode()
          report = pathlib.Path("qnap-approval/profile-sync-security-report.json")
          approval = {
              "schema": 1,
              "service": "profile-sync",
              "image": os.environ["IMAGE"] + "@" + os.environ["DIGEST"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "input_sha256": hashlib.sha256(policy + b"\0" + tree).hexdigest(),
              "platforms": ["linux/amd64", "linux/arm/v7"],
              "security_report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          pathlib.Path("qnap-approval/qnap-image-approval.json").write_text(
              json.dumps(approval, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-sync-image-digest
          path: image-digest.txt
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qnap-image-approval-profile-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: qnap-approval/
          retention-days: 90
