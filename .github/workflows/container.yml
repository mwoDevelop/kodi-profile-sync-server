name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_rc:
        description: Publish an immutable release-candidate manifest
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/mwodevelop/kodi-profile-sync-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to GHCR for an immutable release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_rc
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_rc == true) }}
          tags: ghcr.io/mwodevelop/kodi-profile-sync-server:sha-${{ github.sha }}
          build-args: BUILD_REVISION=git:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_rc
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify immutable manifest platforms
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            > manifest.json
          python - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
                  entry.get("platform", {}).get("variant"),
              )
              for entry in manifest.get("manifests", [])
          }
          required = {
              ("linux", "amd64", None),
              ("linux", "arm", "v7"),
          }
          missing = required - platforms
          if missing:
              raise SystemExit(f"missing release platforms: {sorted(missing)}")
          print("verified platforms: linux/amd64, linux/arm/v7")
          PY
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-sync-image-digest
          path: image-digest.txt
          retention-days: 90
